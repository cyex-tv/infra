# cyex.tv in production (PLAN.md Phase 9). Its own project, network and volumes: nothing here
# touches cyex-api's containers, network or config.
#
#   docker compose -f compose/docker-compose.yaml up -d --build
#
# Layout on the host: /srv/cyex-tv/infra (this repo), /srv/cyex-tv/infra/env (the real env files,
# gitignored) and /srv/cyex-tv/platform (the images build from it).
#   CYEXTV_ENV_DIR  where db.env, api.env, events.env and worker.env are
#                   (default /srv/cyex-tv/infra/env)
#   PLATFORM_DIR    the cyex-tv/platform checkout (default ../../platform, which is
#                   /srv/cyex-tv/platform when this repo is at /srv/cyex-tv/infra)
#   PUBLIC_API_URL  the API the website talks to (default https://api.cyex.tv)
#   PUBLIC_CDN_URL  where emote, badge and paint pictures are served, when it isn't
#                   https://cdn.cyex.tv (the API's CYEX_TV_CDN_URL; default empty)
#                   Both are baked into the website's Content-Security-Policy at build time,
#                   so the web image is rebuilt (--build) after changing them.
# Both can be set in the shell or in a file passed with --env-file. scripts/install.sh sets them.
# Ports bind to 127.0.0.1 only; the Cloudflare tunnel reaches them (docs/tunnel.md). Secrets come
# from the env files, never from this repo (env/*.example).
name: cyex-tv

x-limits: &small
  restart: unless-stopped
  init: true
  networks: [cyextv]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  tv-db:
    <<: *small
    image: postgres:17-alpine
    # A fixed name, so backups/backup.sh finds it.
    container_name: cyextv-db
    env_file: ["${CYEXTV_ENV_DIR:-/srv/cyex-tv/infra/env}/db.env"]
    volumes:
      - tv-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # If cyex-api shares the host, neither may starve the other (PLAN.md Phase 9).
    deploy:
      resources:
        limits: { memory: 1g, cpus: "1.0" }
    shm_size: 256m

  api:
    <<: *small
    build:
      context: ${PLATFORM_DIR:-../../platform}
      target: api
      # scripts/deploy.sh caps the compiler's cores and passes the commit (shown by GET /v1/meta).
      args: &rust-build
        BUILD_JOBS: ${CYEXTV_BUILD_JOBS:-}
        CYEX_TV_BUILD_SHA: ${CYEX_TV_BUILD_SHA:-}
    image: cyex-tv-api:local
    env_file: ["${CYEXTV_ENV_DIR:-/srv/cyex-tv/infra/env}/api.env"]
    environment:
      CYEX_TV_BIND: 0.0.0.0:8080
      CYEX_TV_TRUST_CLOUDFLARE: "true"
      # /metrics on the private network only: no port is published for it.
      CYEX_TV_METRICS_BIND: 0.0.0.0:9100
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      tv-db: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 512m, cpus: "1.0" }

  events:
    <<: *small
    build:
      context: ${PLATFORM_DIR:-../../platform}
      target: events
      args: *rust-build
    image: cyex-tv-events:local
    env_file: ["${CYEXTV_ENV_DIR:-/srv/cyex-tv/infra/env}/events.env"]
    environment:
      CYEX_TV_BIND: 0.0.0.0:8081
      CYEX_TV_TRUST_CLOUDFLARE: "true"
      # /metrics on the private network only: no port is published for it.
      CYEX_TV_METRICS_BIND: 0.0.0.0:9100
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      tv-db: { condition: service_healthy }
      api: { condition: service_started }
    deploy:
      resources:
        limits: { memory: 512m, cpus: "1.0" }

  worker:
    <<: *small
    build:
      context: ${PLATFORM_DIR:-../../platform}
      target: worker
      args: *rust-build
    image: cyex-tv-worker:local
    env_file: ["${CYEXTV_ENV_DIR:-/srv/cyex-tv/infra/env}/worker.env"]
    environment:
      # /metrics on the private network only; monitoring/check.sh reads it.
      CYEX_TV_METRICS_BIND: 0.0.0.0:9100
    depends_on:
      tv-db: { condition: service_healthy }
      api: { condition: service_started }
    # Transcoding is the heavy part; it gets the most room and a hard cap.
    deploy:
      resources:
        limits: { memory: 1g, cpus: "2.0" }

  # The website (Phase 6). It holds no secrets: the browser talks to api.cyex.tv itself.
  web:
    <<: *small
    build:
      # From the platform root: the API reference page is built from openapi/ and schema/.
      context: ${PLATFORM_DIR:-../../platform}
      dockerfile: apps/web/Dockerfile
      # The CSP allows the API and picture origins the build sees (platform apps/web/Dockerfile).
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.cyex.tv}
        PUBLIC_CDN_URL: ${PUBLIC_CDN_URL:-}
    image: cyex-tv-web:local
    environment:
      ORIGIN: https://cyex.tv
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.cyex.tv}
    ports: ["127.0.0.1:8082:3000"]
    deploy:
      resources:
        # A whole core: right after a deploy every page and script file is new to Cloudflare's
        # cache, and half a core made the first visitors wait.
        limits: { memory: 384m, cpus: "1.0" }

  # The self-hosted CDN (docs/self-hosted-cdn.md). tv-s3 is the S3 gateway the api and worker
  # write to (http://tv-s3:7070 on the cyextv network); tv-cdn serves the same folder, read-only,
  # as https://cdn.cyex.tv. Objects are plain files under ${CDN_DATA_DIR}/<bucket>/.
  # Profile "cdn": these start only with `--profile cdn`, so a plain `up` on a host that still
  # serves from R2 needs no s3.env.
  tv-s3:
    <<: *small
    profiles: ["cdn"]
    image: versity/versitygw:v1.10.0
    environment:
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data
    env_file: ["${CYEXTV_ENV_DIR:-/srv/cyex-tv/infra/env}/s3.env"]
    volumes:
      - ${CDN_DATA_DIR:-/srv/cyex-tv/cdn/data}:/data
    ports: ["127.0.0.1:7070:7070"]
    deploy:
      resources:
        limits: { memory: 512m, cpus: "1.0" }

  # Makes the bucket on first start and exits. Safe to run again: it only creates what is missing.
  tv-s3-init:
    profiles: ["cdn"]
    image: amazon/aws-cli:2.22.35
    restart: "no"
    networks: [cyextv]
    env_file:
      - ${CYEXTV_ENV_DIR:-/srv/cyex-tv/infra/env}/s3.env
      - path: ${CYEXTV_ENV_DIR:-/srv/cyex-tv/infra/env}/cdn.env
        required: false
    environment:
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export AWS_ACCESS_KEY_ID="$$ROOT_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$$ROOT_SECRET_KEY"
        bucket="$${CDN_BUCKET:-cyex-tv-cdn}"
        i=0
        until aws --endpoint-url http://tv-s3:7070 s3api head-bucket --bucket "$$bucket" 2>/dev/null \
            || aws --endpoint-url http://tv-s3:7070 s3api create-bucket --bucket "$$bucket"; do
          i=$$((i + 1))
          [ "$$i" -lt 30 ] || { echo "tv-s3 didn't answer"; exit 1; }
          sleep 2
        done
        echo "bucket $$bucket is ready"
    depends_on:
      tv-s3: { condition: service_started }

  # Caddy: TLS for cdn.cyex.tv, per-IP rate limits, only /emotes/ and /cosmetics/ (cdn/Caddyfile).
  # No public ports: it sits behind the Cloudflare tunnel, which does TLS. The data folder is
  # read-only here.
  tv-cdn:
    <<: *small
    profiles: ["cdn"]
    build:
      context: ../cdn
    image: cyex-tv-cdn:local
    env_file:
      - path: ${CYEXTV_ENV_DIR:-/srv/cyex-tv/infra/env}/cdn.env
        required: false
    # cdn.cyex.tv is a tunnel hostname (docs/tunnel.md): cloudflared reaches cyex-tv-tv-cdn-1:80 on
    # the cyextv network. The host port is for checks on the server only.
    ports: ["127.0.0.1:8083:80"]
    volumes:
      - ${CDN_DATA_DIR:-/srv/cyex-tv/cdn/data}:/srv/cdn:ro
      - tv-cdn-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      tv-s3-init: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { memory: 512m, cpus: "1.0" }

networks:
  cyextv:
    name: cyextv

volumes:
  tv-db:
    name: cyextv-db
  tv-cdn-config:
    name: cyextv-cdn-config
