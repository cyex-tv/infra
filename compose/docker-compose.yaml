# cyex.tv in production (PLAN.md Phase 9). Its own project, network and volumes: nothing here
# touches cyex-api's containers, network or config.
#
#   docker compose -f compose/docker-compose.yaml --env-file /etc/cyextv/compose.env up -d --build
#
# The images build from a checkout of cyex-tv/platform next to this repo (PLATFORM_DIR,
# default ../../platform). Ports bind to 127.0.0.1 only; the Cloudflare tunnel reaches them
# (docs/tunnel.md). Secrets come from env files outside this repo (env/*.example).
name: cyex-tv

x-limits: &small
  restart: unless-stopped
  init: true
  networks: [cyextv]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  tv-db:
    <<: *small
    image: postgres:17-alpine
    # A fixed name, so backups/backup.sh finds it.
    container_name: cyextv-db
    env_file: [/etc/cyextv/db.env]
    volumes:
      - tv-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # If cyex-api shares the host, neither may starve the other (PLAN.md Phase 9).
    deploy:
      resources:
        limits: { memory: 1g, cpus: "1.0" }
    shm_size: 256m

  api:
    <<: *small
    build:
      context: ${PLATFORM_DIR:-../../platform}
      target: api
    image: cyex-tv-api:local
    env_file: [/etc/cyextv/api.env]
    environment:
      CYEX_TV_BIND: 0.0.0.0:8080
      CYEX_TV_TRUST_CLOUDFLARE: "true"
      # /metrics on the private network only: no port is published for it.
      CYEX_TV_METRICS_BIND: 0.0.0.0:9100
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      tv-db: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 512m, cpus: "1.0" }

  events:
    <<: *small
    build:
      context: ${PLATFORM_DIR:-../../platform}
      target: events
    image: cyex-tv-events:local
    env_file: [/etc/cyextv/events.env]
    environment:
      CYEX_TV_BIND: 0.0.0.0:8081
      CYEX_TV_TRUST_CLOUDFLARE: "true"
      # /metrics on the private network only: no port is published for it.
      CYEX_TV_METRICS_BIND: 0.0.0.0:9100
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      tv-db: { condition: service_healthy }
      api: { condition: service_started }
    deploy:
      resources:
        limits: { memory: 512m, cpus: "1.0" }

  worker:
    <<: *small
    build:
      context: ${PLATFORM_DIR:-../../platform}
      target: worker
    image: cyex-tv-worker:local
    env_file: [/etc/cyextv/worker.env]
    environment:
      # /metrics on the private network only; monitoring/check.sh reads it.
      CYEX_TV_METRICS_BIND: 0.0.0.0:9100
    depends_on:
      tv-db: { condition: service_healthy }
      api: { condition: service_started }
    # Transcoding is the heavy part; it gets the most room and a hard cap.
    deploy:
      resources:
        limits: { memory: 1g, cpus: "2.0" }

  # The website (Phase 6) joins here once it exists:
  # web:
  #   <<: *small
  #   build: { context: ${PLATFORM_DIR:-../../platform}/apps/web }
  #   ports: ["127.0.0.1:8082:3000"]

networks:
  cyextv:
    name: cyextv

volumes:
  tv-db:
    name: cyextv-db
